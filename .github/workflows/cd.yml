name: CD - Docker Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/chatteia' }}
            DATABASE_SSL=${{ secrets.DATABASE_SSL || 'false' }}
            TWITCH_CLIENT_ID=${{ secrets.TWITCH_CLIENT_ID || 'test-client-id' }}
            TWITCH_CLIENT_SECRET=${{ secrets.TWITCH_CLIENT_SECRET || 'test-client-secret' }}
            KICK_CLIENT_ID=${{ secrets.KICK_CLIENT_ID || 'test-kick-client-id' }}
            KICK_CLIENT_SECRET=${{ secrets.KICK_CLIENT_SECRET || 'test-kick-client-secret' }}
            KICK_REDIRECT_URI=${{ secrets.KICK_REDIRECT_URI || 'http://localhost:3000/api/platforms/kick/auth/callback' }}
            KICK_API_URL=${{ secrets.KICK_API_URL || 'https://api.kick.com/public/v1' }}
            YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY || 'test-youtube-key' }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || 'test-google-client-id' }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET || 'test-google-client-secret' }}
            SMTP_HOST=${{ secrets.SMTP_HOST || 'localhost' }}
            SMTP_PORT=${{ secrets.SMTP_PORT || '1025' }}
            SMTP_USER=${{ secrets.SMTP_USER || 'test-user' }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD || 'test-pass' }}
            SMTP_FROM=${{ secrets.SMTP_FROM || 'Chatteia <no-reply@chatteia.local>' }}
            NEXT_PUBLIC_TIKTOK_WORKER_URL=${{ secrets.NEXT_PUBLIC_TIKTOK_WORKER_URL || 'http://localhost:4000' }}
            TIKTOK_WORKER_URL=${{ secrets.TIKTOK_WORKER_URL || 'http://localhost:4000' }}
            TIKTOK_WORKER_SECRET=${{ secrets.TIKTOK_WORKER_SECRET || 'test-worker-secret' }}
