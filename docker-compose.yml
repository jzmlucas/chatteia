services:
  db:
    image: postgres:16-alpine
    container_name: chatteia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatteia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatteia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://postgres:postgres@db:5432/chatteia?sslmode=disable
        DATABASE_SSL: "false"
    container_name: chatteia-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/chatteia?sslmode=disable
      DATABASE_SSL: "false"
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: chatteia
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
