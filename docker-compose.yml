services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/chatteia?sslmode=disable}
        DATABASE_SSL: ${DATABASE_SSL:-false}
    container_name: chatteia-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/chatteia?sslmode=disable}
      DATABASE_SSL: ${DATABASE_SSL:-false}
    ports:
      - "3000:3000"
